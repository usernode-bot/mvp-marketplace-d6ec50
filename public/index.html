<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MVP Marketplace</title>

  <script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c3aed'/%3E%3Cpath d='M31 40h38l-3 33a8 8 0 0 1-8 7H42a8 8 0 0 1-8-7z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M38 40v-6a12 12 0 0 1 24 0v6' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js at the repo root; npm run build compiles
       styles/tailwind-input.css to public/tailwind.css on every image build,
       so the stylesheet is always generated from THIS commit's markup.
       Design tokens (the brand color ramp and card shadows) are in the
       config's theme.extend; reusable component classes (buttons, cards,
       badges, inputs) are in the @layer components block of the input CSS.
       Class names must be written as whole literals in markup and JS strings
       for the compiler to see them. -->
  <link rel="stylesheet" href="/tailwind.css">
  <script>
  // Theme bootstrap: restore the saved color theme before first paint so a
  // saved Midnight never flashes the light default. Mirrors the validation
  // in public/js/theme.js; anything missing or unrecognized stays Purple
  // Dream (the CSS :root variables), so the attribute is simply not set.
  (function () {
    try {
      var t = localStorage.getItem('bazario:theme');
      if (t && t !== 'purple' && ['ocean', 'sunset', 'mint', 'midnight'].indexOf(t) !== -1) {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
  </script>
  <!-- The platform's native-feel UI kit (opt-in). Provides automatic pressed
       states on buttons and `unNative.toast()` for add-to-cart feedback.
       Centrally hosted by RELATIVE path, like the bridge: never vendor it,
       never write a hostname. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a page without it is invisible to
       anything that asks the frame a question (offline launch included).
       This app paints a LIGHT page (bg-page, a light gray, on the body
       element), so the
       bridge reports that tone and the platform bar above the app matches. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-page text-zinc-900 antialiased">

  <header id="app-header" class="sticky top-0 z-40 border-b border-line bg-white/90 shadow-header backdrop-blur">
    <div class="mx-auto max-w-7xl px-4">
      <div class="flex h-14 items-center gap-2 md:h-16 md:gap-4">

        <!-- Logo -->
        <button data-nav="home" class="flex shrink-0 items-center gap-2 rounded-lg py-1 pr-2 text-left" aria-label="MVP Marketplace home">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white shadow-card">
            <span data-icon="bag" data-cls="h-5 w-5"></span>
          </span>
          <span class="text-lg font-bold tracking-tight text-zinc-900">MVP Marketplace</span>
        </button>

        <!-- Desktop navigation (bottom nav covers mobile) -->
        <nav class="hidden items-center gap-1 lg:flex" aria-label="Primary">
          <button class="nav-link nav-link-active" data-nav="home"><span data-icon="home" data-cls="h-4 w-4"></span>Home</button>
          <button class="nav-link" data-nav="categories"><span data-icon="grid" data-cls="h-4 w-4"></span>Categories</button>
          <button class="nav-link" data-nav="cart">
            <span class="relative">
              <span data-icon="cart" data-cls="h-4 w-4"></span>
              <span data-cart-badge class="absolute -right-2 -top-1.5 hidden h-4 min-w-4 rounded-full bg-rose-600 px-1 text-center text-[9px] font-bold leading-4 text-white">0</span>
            </span>Cart</button>
          <button class="nav-link" data-nav="orders"><span data-icon="package" data-cls="h-4 w-4"></span>Orders</button>
          <button class="nav-link" data-nav="profile"><span data-icon="user" data-cls="h-4 w-4"></span>Profile</button>
        </nav>

        <!-- Desktop search -->
        <div class="search-box relative ml-2 hidden max-w-md flex-1 lg:block">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"><span data-icon="search" data-cls="h-5 w-5"></span></span>
            <input type="search" class="input" placeholder="Search products, brands, and more" autocomplete="off" aria-label="Search products">
          </div>
          <div class="search-panel absolute inset-x-0 top-full z-30 mt-2 hidden rounded-xl border border-zinc-100 bg-white p-3 shadow-card-lg"></div>
        </div>

        <!-- Actions -->
        <div class="ml-auto flex items-center gap-0.5 lg:ml-0">
          <!-- Color theme switcher (desktop; the Profile page hosts the
               swatches on mobile, where this header has no room). Filled by
               theme.js at boot. -->
          <div id="theme-swatches" class="hidden items-center gap-1.5 lg:flex" role="radiogroup" aria-label="Color theme"></div>
          <button class="icon-btn" id="bell-btn" aria-label="Notifications">
            <span data-icon="bell" data-cls="h-5 w-5"></span>
            <span aria-hidden="true" class="absolute right-2 top-2 h-2 w-2 rounded-full bg-rose-500"></span>
          </button>
          <button class="icon-btn" data-nav="cart" aria-label="Cart">
            <span class="relative">
              <span data-icon="cart" data-cls="h-5 w-5"></span>
              <span data-cart-badge class="absolute -right-1.5 -top-1 hidden h-4 min-w-4 rounded-full bg-rose-600 px-1 text-center text-[9px] font-bold leading-4 text-white">0</span>
            </span>
          </button>
        </div>
      </div>

      <!-- Mobile search (second row) -->
      <div class="pb-3 lg:hidden">
        <div class="search-box relative">
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"><span data-icon="search" data-cls="h-5 w-5"></span></span>
            <input type="search" class="input" placeholder="Search products, brands, and more" autocomplete="off" aria-label="Search products">
          </div>
          <div class="search-panel absolute inset-x-0 top-full z-30 mt-2 hidden rounded-xl border border-zinc-100 bg-white p-3 shadow-card-lg"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 pb-28 pt-4 lg:pb-12">
    <div id="view-home" data-view="home" class="home-canvas">
      <!-- Promotional carousel -->
      <section id="section-promo" aria-label="Promotions">
        <div id="promo-carousel" class="no-scrollbar flex snap-x snap-mandatory gap-3 overflow-x-auto rounded-2xl"></div>
        <div id="promo-dots" class="mt-3 flex justify-center gap-1.5"></div>
      </section>

      <!-- Categories -->
      <section id="section-categories" class="panel mt-6 p-4 sm:p-5" aria-label="Categories">
        <div class="section-head">
          <span class="accent-bar"></span>
          <h2 class="section-title">Categories</h2>
        </div>
        <div id="category-grid" class="mt-3 grid grid-cols-4 gap-2 sm:grid-cols-6 lg:grid-cols-8"></div>
      </section>

      <!-- App shortcuts -->
      <section id="section-shortcuts" class="panel mt-7 p-4 sm:p-5" aria-label="App shortcuts">
        <div class="section-head">
          <span class="accent-bar"></span>
          <h2 class="section-title">App shortcuts</h2>
        </div>
        <div id="app-shortcut-grid" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <!-- Flash Sale -->
      <section id="section-flash" class="panel panel-flash mt-7 p-4 sm:p-5" aria-label="Flash Sale">
        <div class="section-head">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-sale-50 text-sale-600"><span data-icon="flame" data-cls="h-5 w-5"></span></span>
          <h2 class="section-title">Flash Sale</h2>
          <div class="ml-auto flex items-center gap-1.5">
            <span class="text-xs text-zinc-500">Ends in</span>
            <div id="flash-timer" class="flex items-center gap-1" aria-live="off"></div>
          </div>
        </div>
        <div id="flash-row" class="no-scrollbar mt-3 flex snap-x snap-mandatory gap-3 overflow-x-auto pb-1"></div>
      </section>

      <!-- Recommended -->
      <section id="section-recommended" class="panel mt-7 p-4 sm:p-5" aria-label="Recommended products">
        <div class="section-head">
          <span class="accent-bar"></span>
          <h2 class="section-title">Recommended for you</h2>
        </div>
        <div id="recommended-grid" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>
      </section>

      <!-- Search / filter results (hidden until a search or category tap) -->
      <section id="results-section" class="hidden" aria-label="Results">
        <div class="flex items-center gap-2">
          <button id="results-clear" data-results-clear class="icon-btn -ml-2" aria-label="Back to home"><span data-icon="chevronLeft" data-cls="h-5 w-5"></span></button>
          <h2 id="results-title" class="section-title truncate"></h2>
          <span id="results-count" class="badge-soft ml-1"></span>
        </div>
        <div id="results-grid" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>
        <div id="results-empty" class="hidden"></div>
      </section>
    </div>

    <div id="view-categories" data-view="categories" class="hidden"></div>
    <div id="view-cart" data-view="cart" class="hidden"></div>
    <div id="view-checkout" data-view="checkout" class="hidden"></div>
    <div id="view-orders" data-view="orders" class="hidden"></div>
    <div id="view-profile" data-view="profile" class="hidden"></div>
    <!-- Category browse / search results (browse.js) and product detail
         (product.js) render into these containers. -->
    <div id="view-browse" data-view="browse" class="hidden"></div>
    <div id="view-product" data-view="product" class="hidden"></div>
  </main>

  <!-- Bottom navigation (mobile) -->
  <nav id="bottom-nav" class="fixed inset-x-0 bottom-0 z-40 border-t border-zinc-100 bg-white lg:hidden" aria-label="Primary" style="padding-bottom: var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px));">
    <div class="mx-auto flex max-w-lg">
      <button class="nav-item nav-item-active" data-nav="home"><span data-icon="home" data-cls="h-5 w-5"></span>Home</button>
      <button class="nav-item" data-nav="categories"><span data-icon="grid" data-cls="h-5 w-5"></span>Categories</button>
      <button class="nav-item" data-nav="cart">
        <span class="relative">
          <span data-icon="cart" data-cls="h-5 w-5"></span>
          <span data-cart-badge class="absolute -right-1.5 -top-1 hidden h-4 min-w-4 rounded-full bg-rose-600 px-1 text-center text-[9px] font-bold leading-4 text-white">0</span>
        </span>Cart</button>
      <button class="nav-item" data-nav="orders"><span data-icon="package" data-cls="h-5 w-5"></span>Orders</button>
      <button class="nav-item" data-nav="profile"><span data-icon="user" data-cls="h-5 w-5"></span>Profile</button>
    </div>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
